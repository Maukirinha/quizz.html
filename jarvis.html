<style>
:root{
  --bg:#050a12; --bg2:#081324; --cy:#39d7ff; --cy2:#0a6f92;
  --gold:#ffb648; --red:#ff4d5e; --green:#37f0a0;
  --txt:#dff2ff; --dim:#7fa6bd; --line:rgba(57,215,255,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:
    radial-gradient(120% 80% at 50% -10%, #0d2a44 0%, var(--bg) 60%),
    var(--bg);
  color:var(--txt);
  font-family:"Segoe UI",Roboto,system-ui,sans-serif;
  overflow:hidden;user-select:none;
}

/* ---------- BOOT ---------- */
.boot{position:fixed;inset:0;z-index:60;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.boot.hide{opacity:0;pointer-events:none;transition:opacity .7s}
.boot-core{width:min(46vw,220px);height:auto;
  filter:drop-shadow(0 0 34px rgba(57,215,255,.55));
  animation:surge 1.4s ease-out both}
@keyframes surge{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.boot-text{font-size:13px;letter-spacing:2px;color:var(--dim);text-align:center;line-height:2}
.boot-text p{opacity:0;margin:0}
.boot-text p.on{opacity:1;color:var(--cy)}
.boot-btn{margin-top:10px;padding:16px 34px;background:transparent;color:var(--cy);
  border:1px solid var(--cy);border-radius:40px;letter-spacing:3px;font-size:14px}

/* ---------- TOP ---------- */
.top{position:fixed;top:0;left:0;right:0;height:54px;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(5,10,18,.95),rgba(5,10,18,.4))}
.brand{display:flex;align-items:center;gap:10px;letter-spacing:4px;font-size:15px}
.brand small{letter-spacing:1px;color:var(--dim);font-size:11px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 10px currentColor}
.dot.on{background:var(--green)}
.dot.wake{background:var(--gold)}
.chips{display:flex;gap:8px}
.chip{font-size:11px;padding:5px 10px;border:1px solid var(--line);border-radius:20px;color:var(--dim)}

/* ---------- STAGE ---------- */
.stage{position:absolute;top:54px;bottom:78px;left:0;right:0;display:flex}
@media (max-width:820px){ .stage{flex-direction:column} }

.hud{flex:1.05;display:flex;align-items:center;justify-content:center;position:relative;min-height:38vh}
#reactor{width:min(90%,560px);height:auto}
.hud-center{position:absolute;text-align:center;pointer-events:none}
#hudMode{font-size:14px;letter-spacing:5px;color:var(--cy)}
#hudHint{font-size:12px;color:var(--dim);margin-top:6px;letter-spacing:1px}

.panel{flex:1;display:flex;flex-direction:column;gap:10px;padding:14px;min-height:0}
.live{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(8,19,36,.6)}
.live-label{font-size:10px;letter-spacing:4px;color:var(--cy2)}
.live-text{font-size:17px;margin-top:6px;min-height:26px;color:#fff}
.log{flex:1;overflow-y:auto;border:1px solid var(--line);border-radius:14px;
  padding:12px;background:rgba(8,19,36,.45);font-size:14px;line-height:1.5}
.log .l{margin-bottom:10px;padding-left:10px;border-left:2px solid var(--cy2)}
.log .l.me{border-color:var(--gold)}
.log .l.sys{border-color:var(--red)}
.log .l b{display:block;font-size:10px;letter-spacing:2px;color:var(--dim);margin-bottom:2px}

/* ---------- DOCK ---------- */
.dock{position:fixed;bottom:0;left:0;right:0;height:78px;z-index:20;
  display:flex;border-top:1px solid var(--line);background:rgba(5,10,18,.96);
  padding-bottom:env(safe-area-inset-bottom)}
.dk{flex:1;background:none;border:0;color:var(--dim);font-size:24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dk span{font-size:10px;letter-spacing:1px}
.dk.on{color:var(--cy);text-shadow:0 0 12px var(--cy)}
.dk:active{background:rgba(57,215,255,.12)}

/* ---------- SHEET ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:#03070d;
  display:flex;flex-direction:column}
.sheet[hidden],.flash[hidden]{display:none!important}
.sheet-head{display:flex;align-items:center;gap:12px;
  padding:16px;border-bottom:1px solid var(--line);letter-spacing:3px;font-size:14px}
.sheet-head b{flex:1}
.sheet-mark{width:26px;height:26px;filter:drop-shadow(0 0 8px rgba(57,215,255,.7))}

/* ---- ícone de inicialização dentro do menu ---- */
.launcher{display:flex;align-items:center;gap:18px;padding:18px 16px;
  border-bottom:1px solid var(--line);
  background:radial-gradient(60% 140% at 12% 50%,rgba(57,215,255,.10),transparent 70%)}
.launch-icon{width:84px;height:84px;flex:none;padding:0;border:0;border-radius:50%;
  background:none;position:relative;transition:filter .3s,transform .15s}
.launch-icon img{width:100%;height:100%;display:block}
.launch-icon{filter:drop-shadow(0 0 14px rgba(57,215,255,.35)) saturate(.45) brightness(.72)}
.launch-icon.on{filter:drop-shadow(0 0 26px rgba(57,215,255,.85)) saturate(1) brightness(1)}
.launch-icon:active{transform:scale(.93)}
.launch-icon::after{content:"";position:absolute;inset:-7px;border-radius:50%;
  border:1px solid var(--line)}
.launch-icon.on::after{border-color:var(--cy);animation:aro 2.6s ease-in-out infinite}
@keyframes aro{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.launch-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.launch-txt b{font-size:13px;letter-spacing:3px;color:var(--cy)}
.launch-txt s{text-decoration:none;font-size:12px;color:var(--dim)}
.launch-txt em{font-style:normal;font-size:11px;letter-spacing:1px;color:var(--cy2)}
.sheet-head button{background:none;border:0;color:var(--cy);font-size:22px}
.sheet-tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet-tabs button{white-space:nowrap;background:none;border:1px solid var(--line);
  color:var(--dim);border-radius:20px;padding:8px 14px;font-size:12px}
.sheet-tabs button.on{color:var(--cy);border-color:var(--cy)}
.sheet-body{flex:1;overflow-y:auto;padding:16px 18px 40px;font-size:14px;line-height:1.65}
.sheet-body h3{color:var(--cy);letter-spacing:2px;font-size:13px;margin:22px 0 8px}
.sheet-body h3:first-child{margin-top:0}
.sheet-body .cmd{border-left:2px solid var(--cy2);padding:6px 0 6px 12px;margin-bottom:8px}
.sheet-body .cmd i{display:block;color:var(--gold);font-style:normal}
.sheet-body .cmd s{display:block;text-decoration:none;color:var(--dim);font-size:12px}

/* ---------- OVERLAYS ---------- */
.flash{position:fixed;inset:0;z-index:70;background:#fff}
.dim{position:fixed;inset:0;z-index:15;background:#000;opacity:0;pointer-events:none;transition:opacity .4s}

@keyframes spin{to{transform:rotate(360deg)}}

</style>
</head>

    .replace(/[^\w\s:+\-*/.,%]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  const has = (t, ...words) => words.some(w => t.includes(w));
  const hasAll = (t, ...words) => words.every(w => t.includes(w));

  /* -- números por extenso ------------------------------------ */
  const UNI = {
    zero:0, um:1, uma:1, dois:2, duas:2, tres:3, quatro:4, cinco:5, seis:6,
    sete:7, oito:8, nove:9, dez:10, onze:11, doze:12, treze:13, catorze:14,
    quatorze:14, quinze:15, dezesseis:16, dezessete:17, dezoito:18,
    dezenove:19, vinte:20, trinta:30, quarenta:40, cinquenta:50, sessenta:60,
    setenta:70, oitenta:80, noventa:90, cem:100, cento:100, duzentos:200,
    trezentos:300, quatrocentos:400, quinhentos:500, seiscentos:600,
    setecentos:700, oitocentos:800, novecentos:900, mil:1000, meia:30
  };

  function palavraParaNumero(txt){
    const parts = norm(txt).split(' ');
    let total = 0, cur = 0, achou = false;
    for (const p of parts){
      if (/^\d+$/.test(p)) { cur += +p; achou = true; continue; }
      if (p === 'e') continue;
      if (UNI[p] === undefined) continue;
      achou = true;
      const v = UNI[p];
      if (v === 1000){ cur = (cur || 1) * 1000; total += cur; cur = 0; }
      else cur += v;
    }
    return achou ? total + cur : null;
  }

  /* -- extrai duração em segundos ----------------------------- */
  function duracaoSegundos(txt){
    const t = norm(txt);
    let seg = 0, achou = false;
    const re = /(\d+|[a-z]+(?:\s+e\s+[a-z]+)*)\s*(horas?|h\b|minutos?|min\b|segundos?|seg\b|s\b)/g;
    let m;
    while ((m = re.exec(t))){
      const n = /^\d+$/.test(m[1]) ? +m[1] : palavraParaNumero(m[1]);
      if (n === null) continue;
      achou = true;
      if (/^h/.test(m[2])) seg += n * 3600;
      else if (/^m/.test(m[2])) seg += n * 60;
      else seg += n;
    }
    return achou ? seg : null;
  }

  const fmtDur = s => {
    s = Math.max(0, Math.round(s));
    const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
    const p = [];
    if (h) p.push(h + (h===1?' hora':' horas'));
    if (m) p.push(m + (m===1?' minuto':' minutos'));
    if (x || !p.length) p.push(x + (x===1?' segundo':' segundos'));
    return p.join(' e ');
  };

  const pad = n => String(n).padStart(2,'0');
  const hhmm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());

  const DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira',
                'quinta-feira','sexta-feira','sábado'];
  const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho',
                 'agosto','setembro','outubro','novembro','dezembro'];

  const dataExtenso = d =>
    `${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;

  const saudacao = () => {
    const h = new Date().getHours();
    if (h < 5)  return 'Boa madrugada';
    if (h < 12) return 'Bom dia';
    if (h < 18) return 'Boa tarde';
    return 'Boa noite';
  };

  /* -- matemática segura -------------------------------------- */
  const MATH_WORDS = [
    [/\bmais\b|\bsomado (?:a|com)\b|\bsoma de\b|\badicionar?\b/g,'+'],
    [/\bmenos\b|\bsubtrair\b|\bsubtraido de\b/g,'-'],
    [/\bvezes\b|\bmultiplicado por\b|\bmultiplicar por\b|\bx\b/g,'*'],
    [/\bdividido por\b|\bdividir por\b|\bsobre\b/g,'/'],
    [/\belevado a\b|\bna potencia de\b/g,'**'],
    [/\bpor cento de\b/g,'% de'],
    [/\braiz (?:quadrada )?de\b/g,'sqrt'],
    [/\bvirgula\b/g,'.'],
    [/\bponto\b/g,'.']
  ];

  function calcular(txt){
    let t = norm(txt)
      .replace(/^(jarvis|calcule|calcular|quanto e|quanto eh|quanto da|qual e o resultado de)\s*/g,'');
    MATH_WORDS.forEach(([re, rep]) => { t = t.replace(re, rep); });

    // "20 % de 350"
    const pc = t.match(/(\d+(?:\.\d+)?)\s*%\s*de\s*(\d+(?:\.\d+)?)/);
    if (pc) return (+pc[1] / 100) * (+pc[2]);

    // "sqrt 81"
    const sq = t.match(/sqrt\s*(\d+(?:\.\d+)?)/);
    if (sq) return Math.sqrt(+sq[1]);

    // converte números por extenso soltos
    t = t.replace(/[a-z]+(?:\s+e\s+[a-z]+)*/g, w => {
      const n = palavraParaNumero(w);
      return n === null ? ' ' : ' ' + n + ' ';
    });

    t = t.replace(/[^0-9+\-*/().\s]/g,'').trim();
    if (!/\d/.test(t) || !/[+\-*/]/.test(t)) return null;
    try {
      const r = Function('"use strict";return (' + t + ')')();
      return Number.isFinite(r) ? r : null;
    } catch { return null; }
  }

  const numBonito = n =>
    Math.abs(n % 1) < 1e-9 ? String(Math.round(n))
                           : n.toFixed(2).replace('.', ' vírgula ');

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

  return { norm, has, hasAll, palavraParaNumero, duracaoSegundos, fmtDur,
           pad, hhmm, DIAS, MESES, dataExtenso, saudacao, calcular, numBonito, uid };
})();

</script>
<script>
/* ============================================================
   J.A.R.V.I.S. — store.js
   Persistência local (localStorage) de config, notas, listas,
   lembretes, alarmes, rotinas e memória de contexto.
   ============================================================ */
const Store = (() => {
  const KEY = 'jarvis.v1';

  const DEFAULT = {
    cfg: {
      nome: 'Senhor',
      wake: ['jarvis', 'jarves', 'jarbas', 'darvis', 'javis', 'jarvi'],
      idioma: 'pt-BR',
      voz: null,
      taxa: 1.02,
      tom: 0.9,
      volume: 1,
      autonomo: false,
      mudo: false,
      janelaAtiva: 12000,      // ms que fica "acordado" após wake word
      confirmarAcao: true,
      anunciarHora: false,
      brilhoOverlay: 0
    },
    notas: [],
    listas: {},              // { compras: [itens...] }
    lembretes: [],           // { id, texto, quando(ts), feito }
    alarmes: [],             // { id, h, m, rotulo, dias[], ativo }
    rotinas: [],             // { id, gatilho, acoes[] }
    historico: [],           // últimos comandos
    stats: { comandos: 0, desde: Date.now() }
  };

  let db = load();

  function load(){
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return structuredClone(DEFAULT);
      const parsed = JSON.parse(raw);
      return deepMerge(structuredClone(DEFAULT), parsed);
    } catch { return structuredClone(DEFAULT); }
  }

  function deepMerge(base, extra){
    for (const k in extra){
      if (extra[k] && typeof extra[k] === 'object' && !Array.isArray(extra[k]))
        base[k] = deepMerge(base[k] || {}, extra[k]);
      else base[k] = extra[k];
    }
    return base;
  }

  let t = null;
  function save(){
    clearTimeout(t);
    t = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {}
    }, 150);
  }

  return {
    get db(){ return db; },
    get cfg(){ return db.cfg; },
    save,
    reset(){ db = structuredClone(DEFAULT); save(); },

    addNota(texto){
      db.notas.unshift({ id: U.uid(), texto, ts: Date.now() });
      db.notas = db.notas.slice(0, 200); save();
    },
    addLembrete(texto, quando){
      const l = { id: U.uid(), texto, quando, feito: false };
      db.lembretes.push(l); save(); return l;
    },
    addAlarme(h, m, rotulo){
      const a = { id: U.uid(), h, m, rotulo: rotulo || '', ativo: true, ultimo: 0 };
      db.alarmes.push(a); save(); return a;
    },
    addItemLista(lista, item){
      db.listas[lista] = db.listas[lista] || [];
      db.listas[lista].push(item); save();
    },
    logCmd(texto, resposta){
      db.historico.unshift({ texto, resposta, ts: Date.now() });
      db.historico = db.historico.slice(0, 120);
      db.stats.comandos++; save();
    }
  };
})();

</script>
<script>
/* ============================================================
   J.A.R.V.I.S. — speech.js
   Camada de voz: reconhecimento contínuo com auto-recuperação
   e síntese de fala (TTS) com fila.
   ============================================================ */
const Voz = (() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const suportaOuvir = !!SR;
  const suportaFalar = 'speechSynthesis' in window;

  let rec = null;
  let ligado = false;          // usuário quer escutar
  let rodando = false;         // engine ativa neste instante
  let falando = false;         // TTS em execução
  let reinicios = 0;
  let ultimoReinicio = 0;
  let timerRestart = null;

  const ev = {
    parcial: () => {}, final: () => {},
    estado: () => {}, erro: () => {}
  };

  /* ---------- reconhecimento ---------- */
  function criar(){
    const r = new SR();
    r.lang = Store.cfg.idioma;
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 3;

    r.onstart = () => { rodando = true; reinicios = 0; ev.estado('ouvindo'); };

    r.onresult = e => {
      for (let i = e.resultIndex; i < e.results.length; i++){
        const res = e.results[i];
        const alts = [];
        for (let a = 0; a < res.length; a++) alts.push(res[a].transcript);
        if (res.isFinal) ev.final(alts[0].trim(), alts);
        else ev.parcial(alts[0].trim());
      }
    };

    r.onerror = e => {
      // no-speech / aborted / network são recuperáveis
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        ligado = false;
        ev.erro('Permissão de microfone negada. Libere o microfone nas configurações do navegador.');
        ev.estado('bloqueado');
        return;
      }
      if (e.error === 'audio-capture'){
        ligado = false;
        ev.erro('Nenhum microfone detectado neste tablet.');
        ev.estado('erro');
        return;
      }
      if (e.error === 'network') ev.erro('Rede instável no serviço de voz. Reconectando…');
    };

    r.onend = () => {
      rodando = false;
      ev.estado(ligado ? 'reconectando' : 'parado');
      if (ligado && !falando) agendarRestart();
    };
    return r;
  }

  function agendarRestart(){
    clearTimeout(timerRestart);
    const agora = Date.now();
    if (agora - ultimoReinicio < 1200) reinicios++; else reinicios = 0;
    ultimoReinicio = agora;
    // backoff progressivo para não travar o tablet em loop
    const espera = Math.min(150 * Math.pow(1.8, reinicios), 6000);
    timerRestart = setTimeout(start, espera);
  }

  function start(){
    if (!suportaOuvir || !ligado || rodando || falando) return;
    if (!rec) rec = criar();
    rec.lang = Store.cfg.idioma;
    try { rec.start(); }
    catch (err){ if (!/already started/i.test(err.message)) agendarRestart(); }
  }

  function ligar(){
    if (!suportaOuvir) { ev.erro('Este navegador não suporta reconhecimento de voz. Use o Chrome.'); return false; }
    ligado = true; start(); return true;
  }

  function desligar(){
    ligado = false; clearTimeout(timerRestart);
    try { rec && rec.stop(); } catch {}
    ev.estado('parado');
  }

  /* ---------- síntese ---------- */
  let vozes = [];
  function carregarVozes(){
    if (!suportaFalar) return;
    vozes = speechSynthesis.getVoices() || [];
  }
  if (suportaFalar){
    carregarVozes();
    speechSynthesis.onvoiceschanged = carregarVozes;
  }

  function escolherVoz(){
    if (!vozes.length) carregarVozes();
    const alvo = Store.cfg.voz;
    if (alvo){
      const v = vozes.find(v => v.name === alvo);
      if (v) return v;
    }
    const pt = vozes.filter(v => /pt[-_]?BR/i.test(v.lang) || /pt/i.test(v.lang));
    return pt.find(v => /google/i.test(v.name))
        || pt.find(v => /(luciana|daniel|felipe|brasil)/i.test(v.name))
        || pt[0] || vozes[0] || null;
  }

  const fila = [];
  function falar(texto, opts = {}){
    if (!texto) return Promise.resolve();
    if (Store.cfg.mudo && !opts.forcar) return Promise.resolve();
    if (!suportaFalar) return Promise.resolve();
    return new Promise(resolve => {
      fila.push({ texto, opts, resolve });
      if (!falando) proximo();
    });
  }

  function proximo(){
    const item = fila.shift();
    if (!item){ falando = false; ev.estado(ligado ? 'ouvindo' : 'parado'); start(); return; }

    falando = true;
    ev.estado('falando');
    // pausa a escuta para não ouvir a própria voz (eco)
    try { rec && rodando && rec.stop(); } catch {}

    const u = new SpeechSynthesisUtterance(item.texto);
    const v = escolherVoz();
    if (v) u.voice = v;
    u.lang = Store.cfg.idioma;
    u.rate = item.opts.taxa ?? Store.cfg.taxa;
    u.pitch = item.opts.tom ?? Store.cfg.tom;
    u.volume = item.opts.volume ?? Store.cfg.volume;

    let terminou = false;
    const fim = () => {
      if (terminou) return;
      terminou = true;
      clearTimeout(item.wd);
      item.resolve();
      setTimeout(proximo, 120);
    };
    u.onend = fim;
    u.onerror = fim;

    try { speechSynthesis.cancel(); speechSynthesis.speak(u); }
    catch { fim(); }

    // watchdog: alguns Androids nunca disparam onend
    item.wd = setTimeout(() => {
      if (!terminou){ try { speechSynthesis.cancel(); } catch {} fim(); }
    }, 3500 + item.texto.length * 95);
  }

  function calar(){
    fila.length = 0;
    try { speechSynthesis.cancel(); } catch {}
    falando = false;
    start();
  }

  return {
    suportaOuvir, suportaFalar,
    on(nome, fn){ ev[nome] = fn; },
    ligar, desligar, falar, calar,
    get ligado(){ return ligado; },
    get falando(){ return falando; },
    get vozes(){ if(!vozes.length) carregarVozes(); return vozes; }
  };
})();

</script>
<script>
/* ============================================================
   J.A.R.V.I.S. — device.js
   Acesso ao hardware do tablet: bateria, rede, vibração,
   lanterna, tela cheia, wake-lock, brilho, área de
   transferência, compartilhamento e localização.
   ============================================================ */
const Dev = (() => {

  let bat = null, wakeLock = null;
  let torchTrack = null, torchOn = false;

  /* ---------- bateria ---------- */
  async function iniciarBateria(){
    if (!navigator.getBattery) return null;
    try {
      bat = await navigator.getBattery();
      ['levelchange','chargingchange'].forEach(e =>
        bat.addEventListener(e, () => Dev.onBateria(estadoBateria())));
      return estadoBateria();
    } catch { return null; }
  }

  function estadoBateria(){
    if (!bat) return null;
    return {
      pct: Math.round(bat.level * 100),
      carregando: bat.charging,
      restante: bat.dischargingTime && bat.dischargingTime !== Infinity
                ? bat.dischargingTime : null
    };
  }

  /* ---------- rede ---------- */
  function estadoRede(){
    const c = navigator.connection || {};
    return {
      online: navigator.onLine,
      tipo: c.effectiveType || '—',
      down: c.downlink || null
    };
  }

  /* ---------- vibração ---------- */
  const vibrar = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

  /* ---------- tela ---------- */
  async function telaCheia(on){
    try {
      if (on) await document.documentElement.requestFullscreen();
      else if (document.fullscreenElement) await document.exitFullscreen();
      return true;
    } catch { return false; }
  }

  async function travarOrientacao(modo){
    try { await screen.orientation.lock(modo); return true; } catch { return false; }
  }

  async function manterAcordado(on){
    try {
      if (on){
        if (!('wakeLock' in navigator)) return false;
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
        return true;
      }
      if (wakeLock){ await wakeLock.release(); wakeLock = null; }
      return true;
    } catch { return false; }
  }

  // brilho "virtual": overlay escuro (o navegador não muda o brilho real)
  function brilho(pct){
    pct = Math.min(100, Math.max(10, pct));
    const el = document.getElementById('dim');
    el.style.opacity = String((100 - pct) / 130);
    Store.cfg.brilhoOverlay = pct; Store.save();
    return pct;
  }

  /* ---------- lanterna (torch da câmera) ---------- */
  async function lanterna(on){
    try {
      if (on){
        if (!torchTrack){
          const s = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' }
          });
          torchTrack = s.getVideoTracks()[0];
        }
        const cap = torchTrack.getCapabilities ? torchTrack.getCapabilities() : {};
        if (!cap.torch){ pararLanterna(); return 'sem-torch'; }
        await torchTrack.applyConstraints({ advanced: [{ torch: true }] });
        torchOn = true; return true;
      }
      if (torchTrack){
        try { await torchTrack.applyConstraints({ advanced: [{ torch: false }] }); } catch {}
        pararLanterna();
      }
      torchOn = false; return true;
    } catch { return false; }
  }

  function pararLanterna(){
    if (torchTrack){ try { torchTrack.stop(); } catch {} torchTrack = null; }
    torchOn = false;
  }

  // fallback: tela branca no máximo como lanterna
  function lanternaTela(on){
    const f = document.getElementById('flash');
    f.hidden = !on;
    return on;
  }

  /* ---------- clipboard / share ---------- */
  async function copiar(txt){
    try { await navigator.clipboard.writeText(txt); return true; } catch { return false; }
  }
  async function compartilhar(texto, titulo){
    try {
      if (!navigator.share) return false;
      await navigator.share({ title: titulo || 'J.A.R.V.I.S.', text: texto });
      return true;
    } catch { return false; }
  }

  /* ---------- localização ---------- */
  function local(){
    return new Promise(res => {
      if (!navigator.geolocation) return res(null);
      navigator.geolocation.getCurrentPosition(
        p => res({ lat: p.coords.latitude, lon: p.coords.longitude }),
        () => res(null),
        { timeout: 8000, maximumAge: 300000 }
      );
    });
  }

  /* ---------- notificações ---------- */
  async function notificar(titulo, corpo){
    try {
      if (!('Notification' in window)) return false;
      if (Notification.permission !== 'granted'){
        const p = await Notification.requestPermission();
        if (p !== 'granted') return false;
      }
      new Notification(titulo, { body: corpo, icon: 'icons/icon-192.png' });
      return true;
    } catch { return false; }
  }

  return {
    iniciarBateria, estadoBateria, estadoRede, vibrar, telaCheia,
    travarOrientacao, manterAcordado, brilho, lanterna, lanternaTela,
    pararLanterna, copiar, compartilhar, local, notificar,
    get torchAtiva(){ return torchOn; },
    onBateria: () => {}
  };
})();

</script>
<script>
/* ============================================================
   J.A.R.V.I.S. — skills.js
   Roteador de comandos. Cada habilidade tem: id, nome, exemplos,
   teste(t) e executa(t, ctx). O primeiro teste verdadeiro vence.
   Retorno: string  |  { fala, mostra, silencioso }
   ============================================================ */
const Skills = (() => {

  const S = [];
  const add = s => { S.push(s); return s; };
  const t_ = U.norm;

  /* =========================================================
     1. NÚCLEO / SISTEMA
     ========================================================= */
  add({
    id:'sys.parar', nome:'Parar / cancelar fala', grupo:'Núcleo',
    exemplos:['jarvis pare','cancela','silêncio','chega'],
    teste: t => /^(jarvis\s+)?(pare|parar|cancela|cancelar|chega|quieto|silencio|cala a boca|para de falar)$/.test(t.trim())
               || /\b(pare de falar|cala a boca|fica quieto|faz silencio)\b/.test(t),
    executa: () => { Voz.calar(); return { fala:'', mostra:'⏹ Interrompido.', silencioso:true }; }
  });

  add({
    id:'sys.dormir', nome:'Entrar em espera', grupo:'Núcleo',
    exemplos:['jarvis durma','modo espera','desative a escuta'],
    teste: t => /\b(durma|dormir|modo espera|desligar? a escuta|desative a escuta|ate logo|tchau)\b/.test(t),
    executa: (t, ctx) => { ctx.dormir(); return 'Entrando em modo de espera. Diga Jarvis para me acordar.'; }
  });

  add({
    id:'sys.autonomo', nome:'Modo autônomo', grupo:'Núcleo',
    exemplos:['ative o modo autônomo','desative o modo autônomo'],
    teste: t => /\b(modo autonomo|autonomia|piloto automatico)\b/.test(t),
    executa: (t, ctx) => {
      const on = !/\b(desativ|desliga|encerra|sai do)\w*\b/.test(t);
      ctx.setAutonomo(on);
      return on
        ? 'Modo autônomo ativado. Estou monitorando tudo continuamente e agirei por iniciativa própria.'
        : 'Modo autônomo desativado. Voltando à operação por comando.';
    }
  });

  add({
    id:'sys.voz', nome:'Silenciar / voltar a falar', grupo:'Núcleo',
    exemplos:['fique mudo','volte a falar','fale mais rápido','fale mais devagar'],
    teste: t => /\b(mudo|mudinho|sem voz|volte a falar|pode falar|fale mais (rapido|devagar|alto|baixo))\b/.test(t),
    executa: t => {
      if (/mais rapido/.test(t)){ Store.cfg.taxa = Math.min(2, Store.cfg.taxa + .15); Store.save(); return 'Velocidade aumentada.'; }
      if (/mais devagar/.test(t)){ Store.cfg.taxa = Math.max(.5, Store.cfg.taxa - .15); Store.save(); return 'Velocidade reduzida.'; }
      if (/mais alto/.test(t)){ Store.cfg.volume = 1; Store.save(); return 'Volume no máximo.'; }
      if (/mais baixo/.test(t)){ Store.cfg.volume = .5; Store.save(); return 'Volume reduzido.'; }

    executa: async t => {
      const ref = (t.match(/(?:leia|leia o|leiam|versiculo)\s+([1-3]?\s?[a-z]+\s+\d+[:.]?\d*(?:-\d+)?)/) || [])[1];
      if (ref && navigator.onLine){
        try {
          const r = await fetch('https://bible-api.com/' + encodeURIComponent(ref) + '?translation=almeida');
          if (r.ok){
            const d = await r.json();
            if (d.text) return { mostra:`📖 ${d.reference}\n\n“${d.text.trim()}”`, fala:`${d.reference}. ${d.text.trim()}` };
          }
        } catch {}
      }
      const [r0, txt] = VERSOS_OFFLINE[Math.floor(Math.random() * VERSOS_OFFLINE.length)];
      return { mostra:`📖 ${r0}\n\n“${txt}”`, fala:`${r0}. ${txt}` };
    }
  });

  add({
    id:'biblia.esboco', nome:'Esboço de pregação', grupo:'Bíblia',
    exemplos:['monte um esboço sobre fé','esboço de pregação sobre perdão'],
    teste: t => /\b(esboco|esboço|prega(cao|ção)|sermao|estudo biblico|homilia)\b/.test(t),
    executa: (t, ctx, raw) => {
      const tema = ((raw || t).match(/(?:sobre|a respeito de|do tema|acerca de)\s+(.+)$/i)
                    || [,'a fé'])[1].trim();
      const T = tema.charAt(0).toUpperCase() + tema.slice(1);
      const m = [
        `ESBOÇO DE PREGAÇÃO — ${T.toUpperCase()}`,
        '',
        'I. ABERTURA',
        '   1. Saudação e oração inicial',
        '   2. Leitura do texto base',
        `   3. Tese central: o que a Palavra ensina sobre ${tema}`,
        '',
        'II. CONTEXTO DO TEXTO',
        '   1. Autor, destinatários e data',
        '   2. Situação histórica e cultural',
        '   3. Lugar do texto dentro do livro',
        '',
        'III. DESENVOLVIMENTO (3 pontos)',
        `   1. Primeiro ponto — a definição bíblica de ${tema}`,
        '      a) Texto de apoio',
        '      b) Explicação do termo original',
        '      c) Aplicação imediata',
        `   2. Segundo ponto — os obstáculos a ${tema}`,
        '      a) Exemplo bíblico negativo',
        '      b) Diagnóstico do coração',
        '      c) Advertência pastoral',
        `   3. Terceiro ponto — como viver ${tema} hoje`,
        '      a) Exemplo bíblico positivo',
        '      b) Passos práticos durante a semana',
        '      c) Promessa vinculada à obediência',
        '',
        'IV. ILUSTRAÇÃO CENTRAL',
        '   1. História, testemunho ou analogia',
        '   2. Ponte da ilustração para o texto',
        '',
        'V. APLICAÇÃO PESSOAL',
        '   1. Para o novo convertido',
        '   2. Para o membro maduro',
        '   3. Para quem ainda não creu',
        '',
        'VI. CONCLUSÃO',
        '   1. Recapitulação dos três pontos',
        '   2. Apelo e chamada à decisão',
        '   3. Oração final e bênção'
      ].join('\n');
      return { mostra:m, fala:`Esboço completo sobre ${tema} montado na tela, com abertura, contexto, três pontos de desenvolvimento, ilustração, aplicação e conclusão.` };
    }
  });

  add({
    id:'biblia.plano', nome:'Plano de estudo bíblico', grupo:'Bíblia',
    exemplos:['plano de leitura bíblica','plano de estudo sobre oração'],
    teste: t => /\b(plano de (leitura|estudo)|cronograma biblico|devocional)\b/.test(t),
    executa: (t, ctx, raw) => {
      const tema = ((raw || t).match(/sobre\s+(.+)$/i) || [,'a vida cristã'])[1].trim();
      const dias = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
      const eixos = ['Fundamento bíblico','Exemplos do Antigo Testamento','Ensino de Jesus',
                     'Ensino apostólico','Obstáculos e advertências','Aplicação prática',
                     'Consolidação e oração'];
      const m = [`PLANO SEMANAL DE ESTUDO — ${tema.toUpperCase()}`, ''];
      dias.forEach((d, i) => {
        m.push(`${d.toUpperCase()} — ${eixos[i]}`);
        m.push('   1. Leitura do texto principal');
        m.push('   2. Três perguntas de observação');
        m.push('   3. Uma verdade para memorizar');
        m.push('   4. Um passo de obediência para o dia');
        m.push('');
      });
      return { mostra:m.join('\n'), fala:`Plano semanal de estudo sobre ${tema} organizado em sete dias, cada um com leitura, observação, memorização e aplicação.` };
    }
  });

  /* =========================================================
     8. CONVERSA
     ========================================================= */
  add({
    id:'talk.saudacao', nome:'Saudações', grupo:'Conversa',
    exemplos:['bom dia jarvis','oi','obrigado'],
    teste: t => /\b(bom dia|boa tarde|boa noite|ola|oi|opa|e ai)\b/.test(t),
    executa: () => `${U.saudacao()}, ${Store.cfg.nome}. Estou à disposição.`
  });

  add({
    id:'talk.obrigado', nome:'Agradecimento', grupo:'Conversa',
    exemplos:['obrigado','valeu'],
    teste: t => /\b(obrigad|valeu|agradeco|muito bom)\w*\b/.test(t),
    executa: () => ['Sempre às ordens.','Disponha.','É um prazer servir.','Estou aqui para isso.']
                   [Math.floor(Math.random()*4)]
  });

  add({
    id:'talk.quem', nome:'Identidade', grupo:'Conversa',
    exemplos:['quem é você','qual seu nome','como você funciona'],
    teste: t => /\b(quem (e|eh) voce|qual (o )?seu nome|voce e o que|como voce funciona)\b/.test(t),
    executa: () => 'Sou J.A.R.V.I.S., seu assistente de voz autônomo, executando localmente neste tablet. Escuto continuamente, respondo por voz e controlo os recursos do dispositivo.'
  });

  add({
    id:'talk.nome', nome:'Como me chamar', grupo:'Conversa',
    exemplos:['me chame de pastor','meu nome é Mauro'],
    teste: t => /\b(me chame de|meu nome e|pode me chamar de)\b/.test(t),
    executa: t => {
      const n = (t.match(/(?:me chame de|meu nome e|pode me chamar de)\s+(.+)$/) || [])[1];
      if (!n) return 'Como devo chamá-lo?';
      const nome = n.trim().split(' ').map(w => w[0].toUpperCase() + w.slice(1)).join(' ');
      Store.cfg.nome = nome; Store.save();
      return `Perfeito, ${nome}. Passarei a chamá-lo assim.`;
    }
  });

  /* =========================================================
     ROTEADOR
     ========================================================= */
  async function rotear(fala, ctx){
    const t = t_(fala);
    if (!t) return null;
    for (const s of S){
      try {
        if (s.teste(t, fala)) return { skill:s, r: await s.executa(t, ctx, fala) };
      } catch (e){
        return { skill:s, r:'Houve uma falha ao executar esse comando: ' + e.message };
      }
    }
    return null;
  }

  const grupos = () => [...new Set(S.map(s => s.grupo))];
  const porGrupo = g => S.filter(s => s.grupo === g);

  return { rotear, lista:S, grupos, porGrupo };
})();

</script>
<script>
/* ============================================================
   J.A.R.V.I.S. — autonomy.js
   Motor autônomo: vigia o relógio, os lembretes, os alarmes,
   a bateria e a rede, e age por iniciativa própria.
   ============================================================ */
const Auto = (() => {

  let tick = null;
  const timers = [];              // temporizadores voláteis
  let ultimaHoraAnunciada = -1;
  let avisoBateria = { b20:false, b10:false, cheia:false };
  let ultimoOnline = navigator.onLine;

  let saida = () => {};           // injetado pelo app (fala + log)

  /* ---------- temporizadores ---------- */
  function novoTimer(segundos, rotulo){
    const t = {
      id: U.uid(), rotulo,
      fim: Date.now() + segundos * 1000,
      handle: setTimeout(() => {
        Dev.vibrar([300,150,300,150,500]);
        Dev.notificar('J.A.R.V.I.S.', `${rotulo} concluído`);
        saida(`${rotulo} concluído. O tempo de ${U.fmtDur(segundos)} terminou, ${Store.cfg.nome}.`, 'alerta');
        remover(t.id);
      }, segundos * 1000)
    };
    timers.push(t);
    return t;
  }
  function remover(id){
    const i = timers.findIndex(x => x.id === id);
    if (i >= 0){ clearTimeout(timers[i].handle); timers.splice(i, 1); }
  }
  const listarTimers = () => timers.map(t => ({
    rotulo: t.rotulo, restante: Math.max(0, (t.fim - Date.now()) / 1000)
  }));

  /* ---------- ciclo de vigilância (1 s) ---------- */
  function ciclo(){
    const agora = new Date();

    /* lembretes vencidos */
    let mudou = false;
    for (const l of Store.db.lembretes){
      if (!l.feito && l.quando <= Date.now()){
        l.feito = true; mudou = true;
        Dev.vibrar([200,100,200]);
        Dev.notificar('Lembrete', l.texto);
        saida(`Lembrete, ${Store.cfg.nome}: ${l.texto}.`, 'alerta');
      }
    }
    if (mudou) Store.save();

    /* alarmes */
    for (const a of Store.db.alarmes){
      if (!a.ativo) continue;
      const chave = agora.toDateString() + a.h + ':' + a.m;
      if (agora.getHours() === a.h && agora.getMinutes() === a.m && a.ultimo !== chave){
        a.ultimo = chave; Store.save();
        Dev.vibrar([400,200,400,200,600]);
        Dev.notificar('Alarme', `${U.pad(a.h)}:${U.pad(a.m)} ${a.rotulo}`);
        saida(`Alarme das ${a.h} e ${U.pad(a.m)}. ${a.rotulo || 'Hora de acordar'}, ${Store.cfg.nome}.`, 'alerta');
      }
    }

    /* somente no modo autônomo: iniciativa própria */
    if (Store.cfg.autonomo){
      /* anúncio de hora cheia */
      if (Store.cfg.anunciarHora && agora.getMinutes() === 0 &&
          agora.getHours() !== ultimaHoraAnunciada){
        ultimaHoraAnunciada = agora.getHours();
        saida(`São ${agora.getHours()} horas em ponto.`, 'auto');
      }

      /* bateria */
      const b = Dev.estadoBateria();
      if (b){
        if (!b.carregando && b.pct <= 10 && !avisoBateria.b10){
          avisoBateria.b10 = true;
          saida(`Alerta crítico: bateria em ${b.pct} por cento. Conecte o carregador imediatamente, ${Store.cfg.nome}.`, 'alerta');
        } else if (!b.carregando && b.pct <= 20 && !avisoBateria.b20){
          avisoBateria.b20 = true;
          saida(`Atenção: a bateria caiu para ${b.pct} por cento.`, 'auto');
        } else if (b.carregando && b.pct >= 100 && !avisoBateria.cheia){
          avisoBateria.cheia = true;
          saida('Bateria totalmente carregada. Pode desconectar o carregador.', 'auto');
        }
        if (b.carregando){ avisoBateria.b20 = avisoBateria.b10 = false; }
        if (!b.carregando) avisoBateria.cheia = false;
      }

      /* rede */
      if (navigator.onLine !== ultimoOnline){
        ultimoOnline = navigator.onLine;
        saida(ultimoOnline
          ? 'Conexão com a internet restabelecida.'
          : 'Perdi a conexão com a internet. Continuo operando com os módulos locais.', 'auto');
      }
    }
  }

  function iniciar(fnSaida){
    saida = fnSaida;
    clearInterval(tick);
    tick = setInterval(ciclo, 1000);
  }

  return { iniciar, novoTimer, remover, listarTimers };
})();

</script>
<script>
/* ============================================================
   J.A.R.V.I.S. — hud.js
   Interface holográfica: reator de arco desenhado em canvas,
   reagindo ao estado do assistente.
   ============================================================ */
const Hud = (() => {
  const cv = document.getElementById('reactor');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height, cx = W/2, cy = H/2;

  let estado = 'parado';   // parado | ouvindo | ativo | falando | processando
  let energia = 0;         // 0..1 suavizado
  let alvo = 0;
  let ang = 0;

  const COR = {
    parado:      '#3a5a70',
    ouvindo:     '#39d7ff',
    ativo:       '#ffb648',
    falando:     '#37f0a0',
    processando: '#b072ff',
    bloqueado:   '#ff4d5e'
  };

  function set(e){
    estado = e;
    alvo = e === 'parado' ? .12
         : e === 'ouvindo' ? .40
         : e === 'ativo' ? .75
         : e === 'falando' ? .95
         : e === 'processando' ? .85 : .3;
  }

  function anel(raio, largura, cor, de, ate, alpha){
    ctx.beginPath();
    ctx.arc(cx, cy, raio, de, ate);
    ctx.strokeStyle = cor;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = largura;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function frame(){
    energia += (alvo - energia) * .06;
    ang += .004 + energia * .02;
    const c = COR[estado] || COR.parado;
    const puls = 1 + Math.sin(Date.now()/380) * .035 * (0.3 + energia);

    ctx.clearRect(0, 0, W, H);
    ctx.shadowBlur = 26 * energia;
    ctx.shadowColor = c;

    // anel externo segmentado
    for (let i = 0; i < 16; i++){
      const a = ang + i * (Math.PI*2/16);
      anel(270 * puls, 3, c, a, a + .22, .25 + energia * .5);
    }
    // anel de progresso girando ao contrário
    for (let i = 0; i < 4; i++){
      const a = -ang * 1.7 + i * (Math.PI/2);
      anel(238, 6, c, a, a + .9, .18 + energia * .45);
    }
    // anel fino contínuo
    anel(205, 1.5, c, 0, Math.PI*2, .2 + energia * .3);

    // barras radiais (equalizador)
    const n = 56;
    for (let i = 0; i < n; i++){
      const a = i * (Math.PI*2/n) + ang * .5;
      const amp = (Math.sin(i * 1.7 + Date.now()/160) * .5 + .5) * energia;
      const r1 = 150, r2 = r1 + 12 + amp * 46;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a)*r1, cy + Math.sin(a)*r1);
      ctx.lineTo(cx + Math.cos(a)*r2, cy + Math.sin(a)*r2);
      ctx.strokeStyle = c;
      ctx.globalAlpha = .18 + amp * .6;
      ctx.lineWidth = 2.4;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // núcleo
    const g = ctx.createRadialGradient(cx, cy, 4, cx, cy, 130 * puls);
    g.addColorStop(0, c);
    g.addColorStop(.28, c + '66');
    g.addColorStop(1, 'transparent');
    ctx.globalAlpha = .25 + energia * .6;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, 130 * puls, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;

    anel(96 * puls, 2, c, 0, Math.PI*2, .5 + energia * .4);
    ctx.shadowBlur = 0;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  return { set };
})();

</script>
<script>
/* ============================================================
   J.A.R.V.I.S. — app.js
   Orquestração geral: palavra de ativação, máquina de estados,
   interface, menu de comandos e ciclo de vida do PWA.
   ============================================================ */
(() => {

  const $ = id => document.getElementById(id);
  const el = {
    boot:$('boot'), bootBtn:$('bootBtn'), stateDot:$('stateDot'), stateLabel:$('stateLabel'),
    chipBat:$('chipBat'), chipNet:$('chipNet'), chipClock:$('chipClock'),
    hudMode:$('hudMode'), hudHint:$('hudHint'), live:$('liveText'), log:$('log'),
    btnPower:$('btnPower'), btnAuto:$('btnAuto'), btnPush:$('btnPush'),
    btnMute:$('btnMute'), btnMenu:$('btnMenu'),
    sheet:$('sheet'), sheetTabs:$('sheetTabs'), sheetBody:$('sheetBody'),
    sheetClose:$('sheetClose'), flash:$('flash'),
    btnBoot:$('btnBoot'), launchTitle:$('launchTitle'),
    launchSub:$('launchSub'), launchInfo:$('launchInfo')
  };

  let ativo = false;          // janela de comando aberta (pós wake word)
  let janela = null;          // timeout da janela
  let processando = false;

  /* =========================================================
     SAÍDA (log + voz)
     ========================================================= */
  function linha(quem, texto, classe){
    const d = document.createElement('div');
    d.className = 'l ' + (classe || '');
    d.innerHTML = `<b>${quem} · ${U.hhmm(new Date())}</b>` +
                  texto.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>');
    el.log.appendChild(d);
    el.log.scrollTop = el.log.scrollHeight;
    while (el.log.children.length > 60) el.log.removeChild(el.log.firstChild);
  }

  async function responder(texto, tipo){
    if (!texto) return;
    linha('JARVIS', texto, tipo === 'alerta' ? 'sys' : '');
    await Voz.falar(texto);
  }

  /* saída usada pelo motor autônomo */
  async function saidaAutonoma(texto, tipo){
    linha(tipo === 'alerta' ? 'ALERTA' : 'AUTÔNOMO', texto, 'sys');
    await Voz.falar(texto, { forcar: tipo === 'alerta' });
  }

  /* =========================================================
     ESTADO VISUAL
     ========================================================= */
  function pinta(estado){
    const mapa = {
      parado:      ['MODO ESPERA',   'toque em Escuta para ativar', ''],
      ouvindo:     ['MONITORANDO',   'diga “Jarvis”',               'on'],
      reconectando:['RECONECTANDO',  'reativando o microfone…',     'on'],
      ativo:       ['ESCUTANDO VOCÊ','pode falar o comando',        'wake'],
      processando: ['PROCESSANDO',   'analisando o comando…',       'wake'],
      falando:     ['RESPONDENDO',   '…',                           'on'],
      bloqueado:   ['SEM MICROFONE', 'libere a permissão',          ''],
      erro:        ['FALHA',         'verifique o microfone',       '']
    };
    const [m, h, dot] = mapa[estado] || mapa.parado;
    el.hudMode.textContent = m;
    el.hudHint.textContent = h;
    el.stateDot.className = 'dot ' + dot;
    el.stateLabel.textContent = estado;
    if (estado === 'bloqueado' || estado === 'erro' || estado === 'parado')
      el.btnPower.classList.remove('on');
    pintaLauncher(estado);
    Hud.set(estado === 'reconectando' ? 'ouvindo' : estado);
  }

  /* =========================================================
     CONTEXTO ENTREGUE ÀS HABILIDADES
     ========================================================= */
  const ctx = {
    dormir(){ fecharJanela(); Voz.desligar(); pinta('parado'); el.btnPower.classList.remove('on'); },
    setAutonomo(on){
      Store.cfg.autonomo = on; Store.save();
      el.btnAuto.classList.toggle('on', on);
      if (on && !Voz.ligado) ligarEscuta();
    },
    abrirMenu(){ abrirSheet(); },
    limpar(){ el.log.innerHTML = ''; },
    timer(seg, rot){ Auto.novoTimer(seg, rot); }
  };

  /* =========================================================
     PALAVRA DE ATIVAÇÃO E JANELA DE COMANDO
     ========================================================= */
  function achaWake(t){
    for (const w of Store.cfg.wake){
      const i = t.indexOf(w);
      if (i >= 0) return { i, w };
    }
    return null;
  }

  function abrirJanela(){
    ativo = true;
    pinta('ativo');
    Dev.vibrar(35);
    clearTimeout(janela);
    janela = setTimeout(() => {
      ativo = false;
      if (Voz.ligado) pinta('ouvindo');
    }, Store.cfg.janelaAtiva);
  }

  function fecharJanela(){ ativo = false; clearTimeout(janela); }

  /* =========================================================
     PROCESSAMENTO DE COMANDO
     ========================================================= */
  async function processar(fala){
    if (!fala || processando) return;
    processando = true;
    fecharJanela();
    pinta('processando');
    linha('VOCÊ', fala, 'me');

    const res = await Skills.rotear(fala, ctx);

    if (!res){
      const alt = [
        'Não reconheci esse comando. Diga “menu” para ver tudo o que posso fazer.',
        'Comando não identificado. Posso abrir o menu de habilidades, se preferir.',
        'Isso está fora dos meus módulos atuais. Diga “ajuda” para a lista completa.'
      ][Math.floor(Math.random()*3)];
      await responder(alt);
      Store.logCmd(fala, alt);
    } else {
      const r = res.r;
      const mostra = typeof r === 'string' ? r : (r.mostra || r.fala || '');
      const diz    = typeof r === 'string' ? r : (r.fala ?? r.mostra ?? '');
      if (mostra) linha('JARVIS', mostra);
      if (diz && !(typeof r === 'object' && r.silencioso)) await Voz.falar(diz);
      Store.logCmd(fala, mostra);
    }

    processando = false;
    if (Voz.ligado) pinta(Store.cfg.autonomo ? 'ouvindo' : 'ouvindo');
    else pinta('parado');
  }

  /* =========================================================
     LIGAÇÕES DA CAMADA DE VOZ
     ========================================================= */
  Voz.on('parcial', txt => {
    el.live.textContent = txt || '—';
    if (!ativo && !Store.cfg.autonomo && achaWake(U.norm(txt))) abrirJanela();
  });

  Voz.on('final', (txt) => {
    el.live.textContent = '—';
    const t = U.norm(txt);
    if (!t) return;

    // modo autônomo: qualquer frase é candidata a comando
    if (Store.cfg.autonomo){
      const w = achaWake(t);
      const limpo = w ? txt.slice(txt.toLowerCase().indexOf(w.w) + w.w.length).trim() || txt : txt;
      processar(limpo);
      return;
    }

    if (ativo){ processar(txt); return; }

    const w = achaWake(t);
    if (!w) return;                       // ignora conversa ambiente
    const resto = t.slice(w.i + w.w.length).trim();
    if (resto.length > 2) processar(resto);
    else {
      abrirJanela();
      Voz.falar(['Pois não.','Às ordens.','Sim?','Estou ouvindo.'][Math.floor(Math.random()*4)]);
    }
  });

  Voz.on('estado', e => {
    if (processando) return;
    if (e === 'falando') { pinta('falando'); return; }
    if (ativo && (e === 'ouvindo' || e === 'reconectando')) { pinta('ativo'); return; }
    pinta(e);
  });

  Voz.on('erro', msg => linha('SISTEMA', msg, 'sys'));

  /* =========================================================
     CONTROLES
     ========================================================= */
  function ligarEscuta(){
    if (Voz.ligar()){
      el.btnPower.classList.add('on');
      pinta('ouvindo');
    }
  }

  el.btnPower.onclick = () => {
    if (Voz.ligado){ ctx.dormir(); linha('SISTEMA','Escuta desativada.','sys'); }
    else { ligarEscuta(); responder('Escuta ativada. Diga Jarvis a qualquer momento.'); }
  };

  el.btnAuto.onclick = () => {
    const on = !Store.cfg.autonomo;
    ctx.setAutonomo(on);
    responder(on
      ? 'Modo autônomo ativado. Não preciso mais da palavra de ativação e agirei por conta própria em alertas.'
      : 'Modo autônomo desativado.');
  };

  el.btnMute.onclick = () => {
    Store.cfg.mudo = !Store.cfg.mudo; Store.save();
    el.btnMute.classList.toggle('on', !Store.cfg.mudo);
    el.btnMute.firstChild.nodeValue = Store.cfg.mudo ? '🔇' : '🔊';
    linha('SISTEMA', Store.cfg.mudo ? 'Voz silenciada.' : 'Voz reativada.', 'sys');
    if (!Store.cfg.mudo) Voz.falar('Voz reativada.');
  };

  // botão "falar": abre janela de comando sem palavra de ativação
  const push = e => {
    e.preventDefault();
    if (!Voz.ligado) ligarEscuta();
    abrirJanela();
    el.btnPush.classList.add('on');
    Voz.calar();
  };
  const pushOff = () => el.btnPush.classList.remove('on');
  el.btnPush.addEventListener('touchstart', push, { passive:false });
  el.btnPush.addEventListener('mousedown', push);
  ['touchend','mouseup','mouseleave'].forEach(ev => el.btnPush.addEventListener(ev, pushOff));

  el.flash.addEventListener('click', () => { el.flash.hidden = true; Dev.lanterna(false); });

  /* =========================================================
     MENU DE COMANDOS (detalhado, por módulo)
     ========================================================= */
  function abrirSheet(grupo){
    el.sheet.hidden = false;
    pintaLauncher(el.stateLabel.textContent);
    const gs = Skills.grupos();
    const atual = grupo || gs[0];
    el.sheetTabs.innerHTML = '';
    gs.forEach(g => {
      const b = document.createElement('button');
      b.textContent = g;
      b.className = g === atual ? 'on' : '';
      b.onclick = () => abrirSheet(g);
      el.sheetTabs.appendChild(b);
    });
    const itens = Skills.porGrupo(atual);
    el.sheetBody.innerHTML =
      `<h3>MÓDULO ${atual.toUpperCase()} — ${itens.length} HABILIDADE(S)</h3>` +
      itens.map((s, i) => `
        <div class="cmd">
          <i>${i+1}. ${s.nome}</i>
          ${(s.exemplos||[]).map(e => `<s>“${e}”</s>`).join('')}
        </div>`).join('') +
      `<h3>COMO ACIONAR</h3>
       <div class="cmd"><i>1. Por palavra de ativação</i><s>Diga “Jarvis” e aguarde o sinal âmbar, depois fale o comando.</s></div>
       <div class="cmd"><i>2. Em frase única</i><s>“Jarvis, que horas são” — comando direto, sem pausa.</s></div>
       <div class="cmd"><i>3. Por toque</i><s>Segure o botão 🎙️ Falar e diga o comando, sem palavra de ativação.</s></div>
       <div class="cmd"><i>4. Modo autônomo</i><s>Com 🤖 ativo, qualquer frase é interpretada como comando e o sistema alerta sozinho sobre bateria, rede, alarmes e lembretes.</s></div>`;
  }
  el.btnMenu.onclick = () => abrirSheet();
  el.sheetClose.onclick = () => el.sheet.hidden = true;

  /* =========================================================
     BARRA SUPERIOR
     ========================================================= */
  function relogio(){ el.chipClock.textContent = U.hhmm(new Date()); }
  setInterval(relogio, 1000); relogio();

  function pintaBateria(b){
    if (!b) { el.chipBat.textContent = '🔋 —'; return; }
    el.chipBat.textContent = (b.carregando ? '⚡ ' : '🔋 ') + b.pct + '%';
  }
  Dev.onBateria = pintaBateria;

  function pintaRede(){
    const r = Dev.estadoRede();
    el.chipNet.textContent = r.online ? '📶 ' + r.tipo : '✈️ offline';
  }
  addEventListener('online', pintaRede);
  addEventListener('offline', pintaRede);
  pintaRede();

  /* =========================================================
     BOOT
     ========================================================= */
  function sequenciaBoot(){
    const ls = [...document.querySelectorAll('.boot-text p')];
    ls.forEach((p, i) => setTimeout(() => p.classList.add('on'), 350 + i * 420));
  }
  sequenciaBoot();

  /* ---- ícone de inicialização do menu ---- */
  function pintaLauncher(estado){
    const ativo = Voz.ligado && estado !== 'bloqueado' && estado !== 'erro';
    el.btnBoot.classList.toggle('on', ativo);
    el.launchTitle.textContent =
      estado === 'bloqueado' ? 'MICROFONE BLOQUEADO'
      : estado === 'erro'    ? 'FALHA NO NÚCLEO'
      : ativo                ? 'NÚCLEO ATIVO'
                             : 'NÚCLEO EM ESPERA';
    el.launchSub.textContent = ativo
      ? 'toque no reator para reinicializar'
      : 'toque no reator para inicializar';
    el.launchInfo.textContent =
      `${Skills.lista.length} habilidades · ${Skills.grupos().length} módulos · ` +
      `${Store.cfg.autonomo ? 'autônomo' : 'por comando'}`;
  }

  async function inicializar(primeira){
    // desbloqueia áudio e microfone no gesto do usuário
    try { await navigator.mediaDevices.getUserMedia({ audio:true })
            .then(s => s.getTracks().forEach(t => t.stop())); } catch {}
    Voz.falar(' ', { forcar:true });

    await Dev.iniciarBateria().then(pintaBateria);
    Dev.manterAcordado(true);
    if (Store.cfg.brilhoOverlay) Dev.brilho(Store.cfg.brilhoOverlay);

    el.btnMute.classList.toggle('on', !Store.cfg.mudo);
    el.btnAuto.classList.toggle('on', Store.cfg.autonomo);

    Auto.iniciar(saidaAutonoma);
    ligarEscuta();

    linha('SISTEMA', (primeira ? 'Núcleo iniciado. ' : 'Núcleo reinicializado. ') +
          Skills.lista.length + ' habilidades carregadas em ' +
          Skills.grupos().length + ' módulos.', 'sys');

    await responder(primeira
      ? `${U.saudacao()}, ${Store.cfg.nome}. Sistema J.A.R.V.I.S. online e monitorando. ` +
        `Diga Jarvis para me acionar, ou toque no menu para ver todos os comandos.`
      : `Núcleo reinicializado, ${Store.cfg.nome}. Todos os módulos recarregados e escuta restabelecida.`);
  }

  el.bootBtn.onclick = () => {
    el.boot.classList.add('hide');
    setTimeout(() => el.boot.style.display = 'none', 800);
    inicializar(true);
  };

  // reinicialização pelo ícone do menu
  el.btnBoot.onclick = async () => {
    Dev.vibrar([40, 60, 40]);
    Voz.calar();
    Voz.desligar();
    fecharJanela();
    pinta('parado');
    el.launchTitle.textContent = 'REINICIALIZANDO…';
    el.launchSub.textContent = 'recarregando módulos';
    await new Promise(r => setTimeout(r, 700));
    await inicializar(false);
  };

  // reativa a escuta ao voltar para o app
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Voz.ligado) setTimeout(() => Voz.ligar(), 400);
  });

  /* =========================================================
     PWA
     ========================================================= */
  /* versão de arquivo único: sem service worker */

})();

</script>
</body>
</html>
