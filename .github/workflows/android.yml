name: APK do J.A.R.V.I.S.

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o SDK do Android
        uses: android-actions/setup-android@v3

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Renomear o arquivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk jarvis.apk

      - name: Publicar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis.apk
          retention-days: 90

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: J.A.R.V.I.S. APK ${{ github.run_number }}
          body: |
            APK do assistente de voz J.A.R.V.I.S. para Android.

            Instalação:
            1. Baixe o arquivo jarvis.apk pelo celular.
            2. Autorize a instalação de fontes desconhecidas quando o Android pedir.
            3. Abra o app, conceda o microfone e ative o controle do celular.
          files: jarvis.apk
